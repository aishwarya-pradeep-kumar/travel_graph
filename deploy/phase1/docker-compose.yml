# Phase 1 - local Neo4j only.
# See spec in chat / docs/phase1_plan.md.
# Reads NEO4J_PASSWORD from .env (or shell env).
#
# Bring up:   make up PHASE=1
# Tear down:  make down PHASE=1
# Browser:    http://localhost:7474   (bolt://localhost:7687)

services:
  neo4j:
    container_name: transitgraph-neo4j
    image: neo4j:5.24.0-community
    ports:
      - 7474:7474
      - 7687:7687
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_heap_initial__size=512M
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD}' 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  neo4j-data: