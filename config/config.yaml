mqtt:
  broker: "mqtt.hsl.fi"
  port: 1883
  topics:
    - "/hfp/v2/journey/ongoing/vp/+/+/+/+/+/+/+/+/+/+/+/+/+/+"
  client_id: "transitgraph_client"
  keepalive: 60
  qos: 1

kafka:
  bootstrap_servers: "localhost:9092"
  topic: "transit_positions"
  
neo4j:
  uri: "bolt://localhost:7687"
  user: "neo4j"
  password: "password"
  database: "transitgraph"

processing:
  batch_size: 100
  batch_timeout_ms: 1000
  co_location_distance_m: 100
  co_location_time_window_s: 60


